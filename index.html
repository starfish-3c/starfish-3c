<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>星星魚選3C</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #fff1f2);
      color: #1f2937;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .hero {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #dbeafe;
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      margin: 8px 0 10px;
      font-size: 40px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 620px;
      color: #64748b;
      font-size: 17px;
      line-height: 1.8;
    }

    .notice {
      margin: 20px auto 0;
      max-width: 560px;
      padding: 12px 14px;
      border-radius: 18px;
      background: #fff7ed;
      color: #c2410c;
      font-weight: 700;
    }

    .section {
      margin-top: 26px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 26px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 26px;
      text-align: center;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 15px 12px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.18);
      transition: 0.18s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #2563eb;
    }

    .content {
      margin-top: 22px;
      display: grid;
      gap: 14px;
    }

    .card {
      text-align: left;
      background: #ffffff;
      border-radius: 22px;
      padding: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .item {
      margin-top: 12px;
      padding: 14px;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .item-title {
      font-weight: 900;
      margin-bottom: 6px;
    }

    .item-desc {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    a.product-link,
    a.channel-link {
      display: inline-block;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      transition: 0.18s;
    }

    a.product-link:hover,
    a.channel-link:hover {
      transform: translateY(-2px);
      background: #1d4ed8;
    }

    .youtube {
      text-align: center;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    @media (min-width: 760px) {
      .tabs {
        grid-template-columns: repeat(4, 1fr);
      }

      h1 {
        font-size: 52px;
      }

      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

    </section>

    <section class="section youtube">

      <a class="channel-link" href="https://www.youtube.com/channel/UCh7eZnyPZFz48y7NjUkbIew" target="_blank">
        👉 我的頻道

    </section>

    <p class="footer">
      © 2026 星星魚選3C｜AI 輔助整理，購買前請依自身需求判斷。
    </p>
  </main>

  </script>
</body>
</html>
